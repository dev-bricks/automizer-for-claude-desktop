[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automizer-for-claude-desktop"
version = "1.0.2"
description = "Reliably modify and queue scheduled tasks for Claude Desktop"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "dev-bricks Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "claude-desktop",
    "scheduled-tasks",
    "automation",
    "merger",
    "local-first",
    "windows",
    "dev-bricks",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/automizer-for-claude-desktop"
Repository = "https://github.com/dev-bricks/automizer-for-claude-desktop.git"
Issues = "https://github.com/dev-bricks/automizer-for-claude-desktop/issues"
Documentation = "https://github.com/dev-bricks/automizer-for-claude-desktop#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

