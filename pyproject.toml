[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automizer-for-claude-desktop"
version = "1.0.4"
description = "Reliably modify and queue scheduled tasks for Claude Desktop"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [
    {name = "dev-bricks Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = [
    "agent-tools",
    "ai-agents",
    "automation",
    "claude",
    "claude-code",
    "claude-desktop",
    "cli",
    "desktop-automation",
    "dev-bricks",
    "developer-tools",
    "fail-closed",
    "local-first",
    "open-bricks",
    "python",
    "runasinvoker",
    "scheduled-tasks",
    "scheduler",
    "task-scheduler",
    "unofficial",
    "windows",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/automizer-for-claude-desktop"
Repository = "https://github.com/dev-bricks/automizer-for-claude-desktop.git"
Issues = "https://github.com/dev-bricks/automizer-for-claude-desktop/issues"
Documentation = "https://github.com/dev-bricks/automizer-for-claude-desktop#readme"
Changelog = "https://github.com/dev-bricks/automizer-for-claude-desktop/blob/main/CHANGELOG.md"
Security = "https://github.com/dev-bricks/automizer-for-claude-desktop/blob/main/SECURITY.md"
Notice = "https://github.com/dev-bricks/automizer-for-claude-desktop/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/dev-bricks/automizer-for-claude-desktop/blob/main/THIRD_PARTY_LICENSES.md"
"Level 1 SBOM" = "https://github.com/dev-bricks/automizer-for-claude-desktop/blob/main/THIRD_PARTY_LICENSES.txt"
"LLM Ready" = "https://github.com/dev-bricks/automizer-for-claude-desktop/blob/main/llms.txt"
"Marketing Log" = "https://github.com/dev-bricks/automizer-for-claude-desktop/blob/main/MARKETING-LOG.txt"
Umbrella = "https://github.com/open-bricks"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["tools"]
norecursedirs = [".git", ".pytest_cache", "__pycache__", "build", "dist", ".venv"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

